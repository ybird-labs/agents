[project]
name = "exeboard-evals"
version = "0.1.0"
description = "Evaluation harness and metrics helpers."
requires-python = ">=3.12"
dependencies = [
  "exeboard-ai",
  "pydantic>=2",
]

[tool.uv.sources]
exeboard-ai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exeboard_evals"]
