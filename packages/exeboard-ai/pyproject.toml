[project]
name = "exeboard-ai"
version = "0.1.0"
description = "AI orchestration, agents, and graph definitions."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pymupdf>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exeboard_ai"]
